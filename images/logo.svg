<svg width="220" height="56" viewBox="0 0 220 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 間 (Ma) — geometric monoline icon mark -->
  <g stroke="#C8B89A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Outer gate (門) frame -->
    <rect x="4" y="8" width="42" height="40" rx="0"/>
    <!-- Left inner pillar -->
    <rect x="10" y="14" width="11" height="12"/>
    <line x1="10" y1="30" x2="21" y2="30"/>
    <line x1="10" y1="35" x2="21" y2="35"/>
    <!-- Right inner pillar -->
    <rect x="29" y="14" width="11" height="12"/>
    <line x1="29" y1="30" x2="40" y2="30"/>
    <line x1="29" y1="35" x2="40" y2="35"/>
    <!-- Center day radical (日) -->
    <rect x="16" y="28" width="18" height="16"/>
    <line x1="16" y1="36" x2="34" y2="36"/>
  </g>
  <!-- Separator -->
  <line x1="58" y1="12" x2="58" y2="44" stroke="#2A2A28" stroke-width="1"/>
  <!-- Wordmark -->
  <text x="68" y="34" font-family="Georgia,serif" font-size="16" font-weight="300"
        letter-spacing="5" fill="#E8E4DC">KANSO WAY</text>
  <text x="69" y="46" font-family="monospace" font-size="6" letter-spacing="2.5"
        fill="#8A867E">THE LUXURY OF FOCUS</text>
</svg>