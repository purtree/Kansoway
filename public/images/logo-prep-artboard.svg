  <text x="100" y="586" font-family="monospace" font-size="9" fill="#888">favicon.ico (16/32/48px)  ·  apple-touch-icon.png (180x180)  ·  og-image.jpg (1200x630)  ·  logo-square.png (400x400)</text>
